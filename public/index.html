  <noscript><section style="max-width:640px;margin:24px auto;padding:0 16px;color:#eef1ff;font-family:system-ui,sans-serif">
    <h2>SAFIO Quiz : des quiz gratuits à jouer ensemble sur téléphone</h2>
    <p>Une personne crée la partie, les autres scannent le QR code : chacun répond sur son téléphone. Gratuit, sans compte, sans application, en français, anglais, espagnol, néerlandais et allemand.</p>
    <p>Au programme : quiz thématiques et culture générale, Petit Bac, jeux de bluff et d'estimation, et SAFIO Blind Test (l'organisateur lance sa propre musique, SAFIO gère les réponses et les points). Mode solo et classement mondial.</p>
    <p>SAFIO Quiz a besoin de JavaScript pour jouer. <a href="https://playsafio.com/">Découvrir l'univers SAFIO</a></p>
